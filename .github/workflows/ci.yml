name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-scan:
    name: Lint, Security Scan, Import Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest pip-audit==2.10.1

      - name: Python dependency vulnerability scan
        run: pip-audit

      - name: JavaScript dependency vulnerability scan
        run: |
          npm ci --prefix e2e-tests
          npm audit --prefix e2e-tests --audit-level=high

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: git ls-files -z '*.py' | xargs -0 ruff format --check

      - name: JavaScript syntax check
        run: |
          node --check static/philforge-appearance.js
          node --check static/philforge-theme.js
          node --check static/philforge-app.js
          node --check static/philforge-login.js
          node --check static/study_lounge.js
          node --check static/market_movers.js
          node --check static/pwa.js
          node --check static/sw.js

      - name: Bandit security scan
        run: |
          bandit -r . \
            --exclude .venv,venv,tests,_test_api.py \
            --severity-level medium \
            --confidence-level medium \
            -c pyproject.toml

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import check (smoke test)
        env:
          DHAN_CLIENT_ID: "dummy"
          DHAN_ACCESS_TOKEN: "dummy"
          PHILFORGE_PIN: "test-pin-not-real"
          PHILFORGE_SKIP_STARTUP_JOBS: "1"
          PHILFORGE_STARTUP_SCRIP_MASTER: "0"
          PHILFORGE_STARTUP_TRADE_BACKFILL: "0"
          PHILFORGE_STARTUP_ENGINE_RESTORE: "0"
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.environ.setdefault('DHAN_CLIENT_ID', 'dummy')
          os.environ.setdefault('DHAN_ACCESS_TOKEN', 'dummy')
          from engine.indicators import ema, rsi, macd, bollinger_bands, supertrend, adx
          from engine.backtest import run_backtest
          print('All imports OK')
          "

      - name: Run focused unit tests
        env:
          DHAN_CLIENT_ID: "dummy"
          DHAN_ACCESS_TOKEN: "dummy"
          PHILFORGE_PIN: "test-pin-not-real"
          PHILFORGE_SKIP_STARTUP_JOBS: "1"
          PHILFORGE_STARTUP_SCRIP_MASTER: "0"
          PHILFORGE_STARTUP_TRADE_BACKFILL: "0"
          PHILFORGE_STARTUP_ENGINE_RESTORE: "0"
        run: |
          python -m unittest discover -s "$PWD/tests" -p 'test_timeframes.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_dashboard_summary.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_broker_check.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_order_submission_safety.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_mfa_action_authorization.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_fib_touch_ladder.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_cascade_fib_boundary_routes.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_hybrid_premium_lookup.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_fib_backtest_route_e2e.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_image_uploads.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_journal_validation.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_request_security.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_logging_safety.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_chart_integrity.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_journal_client_integrity.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_order_input_validation.py'
          python -m unittest discover -s "$PWD/tests" -p 'test_deploy_hardening.py'
