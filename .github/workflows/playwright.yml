name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-philforge:
    name: E2E — PhilForge
    runs-on: ubuntu-latest
    # The suite outgrew fifteen minutes on 2026-08-26: it was still running
    # healthily at two seconds a test when the job was killed mid-file, which
    # reads as "cancelled" and silently blocks every deploy.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── Python (for the FastAPI dev server) ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      # ── Node.js (for Playwright) ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright deps
        working-directory: e2e-tests
        run: |
          npm install
          # `--with-deps` shells out to apt, and Google's Chrome index
          # intermittently serves a corrupt Packages.gz -- "Hash Sum mismatch".
          # It failed twice in a row on 09-Sep-2026 and skipped the deploy
          # without a single test having run, which reads exactly like a red
          # gate. Dropping the cached lists is the standard cure; one retry
          # covers the case where the mirror is still catching up.
          install_browsers() {
            sudo rm -rf /var/lib/apt/lists/*
            sudo apt-get update -qq || true
            npx playwright install --with-deps chromium
          }
          install_browsers || { echo "::warning::apt index was bad, retrying once"; sleep 15; install_browsers; }

      # ── Start PhilForge server ──
      - name: Start PhilForge dev server
        env:
          PHILFORGE_PIN: "123456"
          DHAN_CLIENT_ID: "e2e-dummy"
          DHAN_ACCESS_TOKEN: "e2e-dummy-token"
          PHILFORGE_SKIP_STARTUP_JOBS: "1"
          PHILFORGE_STARTUP_SCRIP_MASTER: "0"
          PHILFORGE_STARTUP_TRADE_BACKFILL: "0"
          PHILFORGE_STARTUP_ENGINE_RESTORE: "0"
        run: |
          uvicorn app:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/health > /dev/null || (echo "Server failed to start" && exit 1)
          echo "PhilForge is up on :8000"

      # ── Run Playwright tests ──
      - name: Run Playwright tests
        env:
          E2E_USERNAME: "admin"
          E2E_PIN: "123456"
          E2E_BASE_URL: "http://localhost:8000"
          E2E_OFFLINE: "1"
          PLAYWRIGHT_ARTIFACT_ROOT: ${{ runner.temp }}/philforge-playwright
        working-directory: e2e-tests
        run: npx playwright test --project=philforge

      # ── Upload artifacts on failure ──
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-philforge
          path: |
            ${{ runner.temp }}/philforge-playwright/playwright-report/
            ${{ runner.temp }}/philforge-playwright/test-results/
          retention-days: 14
