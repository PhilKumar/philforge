# ProtectHome=read-only made the whole of /home read-only, so record_failure()
# could not write last-failure.json and every failure was invisible to
# /api/health -- the app reported ok:true while the upload was broken
# (25-Sep-2026). Re-expose ONLY the backup directory for writing.
[Service]
ReadWritePaths=/home/ec2-user/.local/share/philforge/backups
