<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#08111b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PhilForge">
<meta name="format-detection" content="telephone=no">
<title>PhilForge — Unlock</title>
<link rel="icon" href="/static/pwa-icons/favicon-32.png?v=__ASSET_VERSION__" sizes="32x32" type="image/png">
<link rel="icon" href="/static/pwa-icons/favicon-16.png?v=__ASSET_VERSION__" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/static/pwa-icons/apple-touch-icon.png?v=__ASSET_VERSION__">
<link rel="shortcut icon" href="/favicon.ico?v=__ASSET_VERSION__">
<link rel="manifest" href="/manifest.webmanifest?v=__ASSET_VERSION__">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/static/pwa.js?v=__ASSET_VERSION__" defer></script>
<script src="/static/philforge-appearance.js?v=__ASSET_VERSION__"></script>
<script src="/static/philforge-theme.js?v=__ASSET_VERSION__"></script>
<link rel="stylesheet" href="/static/philforge-login.css?v=__ASSET_VERSION__">
<link rel="stylesheet" href="/static/philforge-theme.css?v=__ASSET_VERSION__">
</head>
<body>

<!-- The same affordance the terminal and CryptoForge's unlock have: theme,
     tint and font are choosable BEFORE login, not only after. Names come
     from PHILFORGE_APPEARANCE_PRESETS — the single vocabulary — never typed
     here by hand. -->
<button type="button" class="login-appearance-toggle" id="login-appearance-toggle" aria-label="Appearance" aria-expanded="false" aria-controls="login-appearance-panel">
  <span class="login-appearance-dot"></span>
  <span>Style</span>
</button>
<div class="login-appearance-panel" id="login-appearance-panel" role="region" aria-labelledby="login-appearance-title" hidden>
  <div class="login-appearance-title" id="login-appearance-title">Appearance</div>
  <div class="login-appearance-label">Theme</div>
  <div class="login-theme-row">
    <button type="button" data-login-theme="dark">Dark</button>
    <button type="button" data-login-theme="light">Light</button>
  </div>
  <div class="login-appearance-label">Tint</div>
  <div class="login-appearance-grid" id="login-tint-grid"></div>
  <div class="login-appearance-label">Font</div>
  <div class="login-font-list" id="login-font-list"></div>
</div>

<main class="unlock-card" id="unlock-card" aria-labelledby="unlock-title">
  <img src="/static/logo.png?v=__ASSET_VERSION__" alt="PhilForge" class="unlock-logo theme-logo dark-variant">
  <img src="/static/logolight.png?v=__ASSET_VERSION__" alt="PhilForge" class="unlock-logo theme-logo light-variant">
  <h1 class="unlock-title" id="unlock-title">PhilForge</h1>
  <div class="unlock-sub">Sign in to continue</div>

  <div class="auth-field">
    <label class="sr-only" for="username-input">Username</label>
    <input type="text" id="username-input" placeholder="Username" autocomplete="username" spellcheck="false" aria-describedby="unlock-status" autofocus>
  </div>

  <div class="auth-field" id="password-field">
    <div class="secret-wrap">
      <label class="sr-only" for="password-input">Password</label>
      <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" aria-describedby="unlock-status">
      <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">Show</button>
    </div>
  </div>

  <div class="auth-field hidden" id="totp-field">
    <input type="text" id="totp-input" placeholder="6-digit authenticator code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" aria-label="Authenticator code">
  </div>

  <div class="mode-switch-row">
    <button type="button" class="mode-switch-btn hidden" id="mode-switch-btn" aria-hidden="true">Use password instead</button>
  </div>

  <div class="pin-section hidden" id="pin-section">
    <div class="pin-dots" id="pin-dots" aria-hidden="true">
      <div class="pin-dot" data-i="0"></div>
      <div class="pin-dot" data-i="1"></div>
      <div class="pin-dot" data-i="2"></div>
      <div class="pin-dot" data-i="3"></div>
      <div class="pin-dot" data-i="4"></div>
      <div class="pin-dot" data-i="5"></div>
    </div>

    <div class="keypad" id="keypad" aria-label="PIN keypad">
      <button type="button" class="key" data-val="1">1</button>
      <button type="button" class="key" data-val="2">2</button>
      <button type="button" class="key" data-val="3">3</button>
      <button type="button" class="key" data-val="4">4</button>
      <button type="button" class="key" data-val="5">5</button>
      <button type="button" class="key" data-val="6">6</button>
      <button type="button" class="key" data-val="7">7</button>
      <button type="button" class="key" data-val="8">8</button>
      <button type="button" class="key" data-val="9">9</button>
      <button type="button" class="key fn" data-val="clear" aria-label="Clear PIN">&#x2715;</button>
      <button type="button" class="key" data-val="0">0</button>
      <button type="button" class="key fn" data-val="back" aria-label="Delete last PIN digit">&#x232b;</button>
    </div>
  </div>

  <div class="unlock-status" id="unlock-status" role="status" aria-live="polite" aria-atomic="true">Enter username &amp; password</div>

  <div class="unlock-actions">
    <button type="button" class="unlock-btn" id="unlock-btn">Unlock</button>
  </div>

  <div class="unlock-referral__DHAN_REFERRAL_HIDDEN_CLASS__" id="unlock-referral">
    <a class="unlock-referral-link" href="__DHAN_REFERRAL_URL__" target="_blank" rel="noopener noreferrer">
      <span>Open a New Dhan Account</span>
      <span>↗</span>
    </a>
    <div class="unlock-referral-qr__DHAN_REFERRAL_QR_HIDDEN_CLASS__">
      <img src="__DHAN_REFERRAL_QR_URL__" alt="Scan to open Dhan account referral link" loading="lazy">
      <span>Scan this QR to open your Dhan invite link on mobile</span>
    </div>
  </div>

  <div class="unlock-footer">Password + authenticator when enabled &middot; Auto-locks after 24h</div>
</main>

<script src="/static/philforge-login.js?v=__ASSET_VERSION__"></script>
</body>
</html>
